<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a32"/>
      <stop offset="100%" stop-color="#0c2d58"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- High-Tech Cleanroom Facility Silhouette -->
  <rect x="200" y="140" width="400" height="220" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Laminar Flow Air Handling Hoods -->
  <rect x="240" y="160" width="90" height="20" rx="4" fill="#0284c7"/>
  <rect x="355" y="160" width="90" height="20" rx="4" fill="#0284c7"/>
  <rect x="470" y="160" width="90" height="20" rx="4" fill="#0284c7"/>

  <!-- Cleanroom Air Shower & Glass Partition -->
  <line x1="200" y1="260" x2="600" y2="260" stroke="#00b4d8" stroke-width="2"/>
  <rect x="240" y="275" width="320" height="70" rx="8" fill="#0f172a" stroke="#64748b"/>
  <text x="400" y="315" text-anchor="middle" fill="#06d6a0" font-family="Arial" font-size="16" font-weight="bold">CLASS 10,000 CLEANROOM</text>

  <!-- Title Badge -->
  <rect x="230" y="390" width="340" height="40" rx="12" fill="rgba(0,0,0,0.5)" stroke="#06d6a0"/>
  <text x="400" y="415" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">SHAMSABAD INDUSTRIAL MANUFACTURING</text>
</svg>

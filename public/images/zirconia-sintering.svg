<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="180" fill="url(#heatGlow)" opacity="0.6"/>

  <!-- Industrial Heavy Frame -->
  <rect x="240" y="70" width="320" height="360" rx="16" fill="#1f2937" stroke="#f97316" stroke-width="2.5"/>
  <rect x="270" y="100" width="260" height="170" rx="12" fill="#030712" stroke="#ea580c"/>

  <!-- MoSi2 Heating Elements (4 rods) -->
  <line x1="310" y1="120" x2="310" y2="240" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="330" y1="120" x2="330" y2="240" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="470" y1="120" x2="470" y2="240" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="490" y1="120" x2="490" y2="240" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>

  <!-- Multi-tier Sagger Tray with Zirconia Discs -->
  <rect x="360" y="160" width="80" height="14" rx="4" fill="#f8fafc"/>
  <rect x="360" y="190" width="80" height="14" rx="4" fill="#f8fafc"/>
  <rect x="360" y="220" width="80" height="14" rx="4" fill="#f8fafc"/>

  <!-- Industrial High-Temp LCD Controller -->
  <rect x="270" y="295" width="260" height="105" rx="8" fill="#000000" stroke="#f97316"/>
  <text x="290" y="330" fill="#f97316" font-family="Arial" font-size="14" font-weight="bold">MoSi2 HEATING STAGE</text>
  <text x="290" y="370" fill="#ffffff" font-family="Arial" font-size="32" font-weight="bold">1650 °C</text>
  <text x="440" y="365" fill="#22c55e" font-family="Arial" font-size="13" font-weight="bold">SOAKING</text>

  <!-- Title Badge Top -->
  <rect x="280" y="18" width="240" height="32" rx="16" fill="rgba(249,115,22,0.2)" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="39" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="13" font-weight="bold">1650L ZIRCONIA SINTERING</text>
</svg>

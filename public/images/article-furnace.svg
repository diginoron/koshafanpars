<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09182b"/>
      <stop offset="100%" stop-color="#142b47"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Temperature Firing Curve Coordinate Axes -->
  <line x1="200" y1="360" x2="620" y2="360" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="360" x2="200" y2="120" stroke="#64748b" stroke-width="2"/>

  <!-- Firing Curve: Predrying -> Vacuum Ramp -> Holding Soak -> Cooling -->
  <path d="M 200 360 L 280 340 L 380 180 L 460 180 L 580 360" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <!-- Vacuum shaded region -->
  <polygon points="280,360 280,340 380,180 460,180 460,360" fill="rgba(56,189,248,0.15)"/>

  <!-- Temperature Points -->
  <circle cx="280" cy="340" r="6" fill="#38bdf8"/>
  <text x="280" y="325" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="12" font-weight="bold">450°C</text>

  <circle cx="380" cy="180" r="6" fill="#f59e0b"/>
  <circle cx="460" cy="180" r="6" fill="#f59e0b"/>
  <text x="420" y="160" text-anchor="middle" fill="#f59e0b" font-family="Arial" font-size="14" font-weight="bold">960°C PEAK</text>

  <rect x="220" y="400" width="360" height="40" rx="12" fill="rgba(0,0,0,0.5)" stroke="#f59e0b"/>
  <text x="400" y="425" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">PORCELAIN FIRING CURVE &amp; CALIBRATION</text>
</svg>

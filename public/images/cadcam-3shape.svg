<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- 3Shape Trios Intraoral Scanner Wand -->
  <g transform="translate(180, 150)">
    <rect x="0" y="80" width="220" height="36" rx="18" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <path d="M 200 85 L 260 92 L 260 104 L 200 111 Z" fill="#38bdf8"/>
    <circle cx="260" cy="98" r="6" fill="#00b4d8" filter="drop-shadow(0 0 8px #00b4d8)"/>
    <text x="50" y="103" fill="#0284c7" font-family="Arial" font-size="12" font-weight="bold">3SHAPE TRIOS</text>
  </g>

  <!-- imes-icore 5-Axis Dental Milling Unit -->
  <g transform="translate(460, 100)">
    <rect width="220" height="280" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Viewing Window -->
    <rect x="25" y="30" width="170" height="150" rx="10" fill="#020617" stroke="#00b4d8"/>
    <!-- Spindle & Milling Bur -->
    <rect x="95" y="45" width="30" height="60" rx="4" fill="#94a3b8"/>
    <line x1="110" y1="105" x2="110" y2="135" stroke="#f59e0b" stroke-width="3"/>
    <!-- 5-axis Disc Clamp with Zirconia Disc -->
    <circle cx="110" cy="140" r="30" fill="#f8fafc" stroke="#64748b"/>
    <!-- Lower Control Panel -->
    <rect x="25" y="200" width="170" height="50" rx="6" fill="#0f172a"/>
    <text x="110" y="230" text-anchor="middle" fill="#06d6a0" font-family="Arial" font-size="12" font-weight="bold">imes-icore 350i Pro</text>
  </g>

  <!-- Title Badge -->
  <rect x="260" y="24" width="280" height="34" rx="17" fill="rgba(0,180,216,0.15)" stroke="#00b4d8"/>
  <text x="400" y="46" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="13" font-weight="bold">3SHAPE &amp; IMES-ICORE CAD/CAM</text>
</svg>

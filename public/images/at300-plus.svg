<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="chamberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b1a30" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Decorative Lighting Orbs -->
  <circle cx="400" cy="220" r="160" fill="url(#chamberGlow)"/>

  <!-- Furnace Body Main Frame -->
  <rect x="250" y="80" width="300" height="340" rx="20" fill="url(#metal)" stroke="#38bdf8" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))"/>
  
  <!-- Upper Firing Hood (Muffle Chamber Cap) -->
  <path d="M 270 80 Q 400 40 530 80 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <rect x="290" y="110" width="220" height="150" rx="14" fill="#0f172a" stroke="#00b4d8" stroke-width="2"/>

  <!-- Glowing Quartz Muffle Window -->
  <circle cx="400" cy="185" r="55" fill="#ea580c" opacity="0.85" filter="url(#glow)"/>
  <circle cx="400" cy="185" r="42" fill="#fed7aa"/>
  <!-- Dental Bridge / Crown in firing chamber -->
  <path d="M 385 190 Q 400 170 415 190 Q 400 200 385 190 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- High-Tech Touch Screen Display -->
  <rect x="280" y="280" width="240" height="110" rx="10" fill="#021024" stroke="#00b4d8" stroke-width="2"/>
  
  <!-- Screen Interface Elements -->
  <text x="300" y="315" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PROGRAM: VITA VM9</text>
  <text x="300" y="348" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="bold">960 °C</text>
  <text x="430" y="345" fill="#06d6a0" font-family="Arial, sans-serif" font-size="13" font-weight="bold">VAC: 98%</text>
  <rect x="300" y="365" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="300" y="365" width="150" height="8" rx="4" fill="url(#cyanGlow)"/>

  <!-- Base Plate & Feet -->
  <rect x="220" y="415" width="360" height="16" rx="6" fill="#334155"/>
  <rect x="250" y="431" width="40" height="12" rx="4" fill="#1e293b"/>
  <rect x="510" y="431" width="40" height="12" rx="4" fill="#1e293b"/>

  <!-- Badge Top -->
  <rect x="330" y="20" width="140" height="30" rx="15" fill="rgba(0,180,216,0.2)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="40" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">KFP AT300 PLUS</text>

  <!-- Side Technical Floating Badges -->
  <g transform="translate(60, 200)">
    <rect width="150" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="75" y="24" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ACCURACY</text>
    <text x="75" y="42" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">± 0.5 °C</text>
  </g>

  <g transform="translate(590, 200)">
    <rect width="150" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="75" y="24" text-anchor="middle" fill="#06d6a0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TOUCHSCREEN</text>
    <text x="75" y="42" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">7" IPS COLOR</text>
  </g>
</svg>

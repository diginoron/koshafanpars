<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021024"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- 3D Digital Mesh / CAD Wireframe of Tooth Crown -->
  <g stroke="#00b4d8" stroke-width="1.5" fill="rgba(0,180,216,0.1)">
    <polygon points="400,120 460,160 480,240 400,300 320,240 340,160"/>
    <polygon points="400,120 400,300 480,240"/>
    <polygon points="400,120 340,160 400,300"/>
    <line x1="340" y1="160" x2="460" y2="160"/>
    <line x1="320" y1="240" x2="480" y2="240"/>
  </g>

  <!-- Digital Data Flow Rays -->
  <circle cx="240" cy="200" r="8" fill="#38bdf8"/>
  <text x="240" y="235" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="12" font-weight="bold">IOS SCAN</text>

  <circle cx="560" cy="200" r="8" fill="#06d6a0"/>
  <text x="560" y="235" text-anchor="middle" fill="#06d6a0" font-family="Arial" font-size="12" font-weight="bold">CAM MILLING</text>

  <line x1="260" y1="200" x2="330" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="470" y1="200" x2="540" y2="200" stroke="#06d6a0" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="220" y="380" width="360" height="40" rx="12" fill="rgba(0,0,0,0.5)" stroke="#00b4d8"/>
  <text x="400" y="405" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">COMPLETE DIGITAL WORKFLOW</text>
</svg>

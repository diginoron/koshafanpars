<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="50%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#030914"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldAbutment" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="cyanRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="220" fill="url(#cyanRadial)"/>

  <!-- Molecular / Osseointegration Nodes in Background -->
  <g stroke="rgba(0,180,216,0.2)" stroke-width="1.5">
    <line x1="200" y1="120" x2="280" y2="180"/>
    <line x1="280" y1="180" x2="220" y2="280"/>
    <line x1="580" y1="140" x2="520" y2="220"/>
    <line x1="520" y1="220" x2="600" y2="300"/>
  </g>
  <circle cx="200" cy="120" r="5" fill="#38bdf8"/>
  <circle cx="280" cy="180" r="7" fill="#00b4d8"/>
  <circle cx="220" cy="280" r="4" fill="#06d6a0"/>
  <circle cx="580" cy="140" r="6" fill="#38bdf8"/>
  <circle cx="520" cy="220" r="8" fill="#00b4d8"/>
  <circle cx="600" cy="300" r="5" fill="#06d6a0"/>

  <!-- Abutment (Top Connection) -->
  <path d="M 370 70 L 430 70 L 440 120 L 425 150 L 375 150 L 360 120 Z" fill="url(#goldAbutment)" stroke="#ca8a04" stroke-width="2"/>
  <rect x="385" y="50" width="30" height="25" rx="3" fill="#eab308" stroke="#ca8a04"/>

  <!-- Implant Collar / Conical Hex Connection -->
  <path d="M 360 150 L 440 150 L 435 180 L 365 180 Z" fill="url(#titanium)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Implant Fixture Body with Precision SLA Micro-Threads -->
  <!-- Main Fixture Cylinder tapering down -->
  <path d="M 365 180 L 435 180 L 420 390 Q 400 420 380 390 L 365 180 Z" fill="url(#titanium)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Thread Wings (Macro & Micro Threads) -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="1.5">
    <!-- Thread 1 -->
    <path d="M 350 195 L 450 195 L 435 210 L 365 210 Z"/>
    <!-- Thread 2 -->
    <path d="M 352 225 L 448 225 L 433 240 L 367 240 Z"/>
    <!-- Thread 3 -->
    <path d="M 355 255 L 445 255 L 430 270 L 370 270 Z"/>
    <!-- Thread 4 -->
    <path d="M 358 285 L 442 285 L 427 300 L 373 300 Z"/>
    <!-- Thread 5 -->
    <path d="M 362 315 L 438 315 L 423 330 L 377 330 Z"/>
    <!-- Thread 6 -->
    <path d="M 366 345 L 434 345 L 420 360 L 380 360 Z"/>
    <!-- Thread 7 (Apical) -->
    <path d="M 372 375 L 428 375 L 415 390 L 385 390 Z"/>
  </g>

  <!-- Cutting Flute (Self-Tapping Apical Groove) -->
  <path d="M 390 340 L 400 395 L 405 340 Z" fill="#1e293b"/>

  <!-- Technical Annotations -->
  <g transform="translate(100, 180)">
    <rect width="180" height="54" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(56,189,248,0.4)"/>
    <text x="14" y="24" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">SURFACE TREATMENT</text>
    <text x="14" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">SLA (Sa 1.8 μm)</text>
  </g>

  <g transform="translate(520, 180)">
    <rect width="180" height="54" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(6,214,160,0.4)"/>
    <text x="14" y="24" fill="#06d6a0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">INTERNAL CONNECTION</text>
    <text x="14" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">11° Conical Hex</text>
  </g>

  <g transform="translate(100, 310)">
    <rect width="180" height="54" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
    <text x="14" y="24" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="11" font-weight="bold">MATERIAL GRADE</text>
    <text x="14" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Pure Titanium Gr.4/5</text>
  </g>

  <g transform="translate(520, 310)">
    <rect width="180" height="54" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(234,179,8,0.4)"/>
    <text x="14" y="24" fill="#facc15" font-family="Arial, sans-serif" font-size="11" font-weight="bold">CLINICAL SUCCESS</text>
    <text x="14" y="44" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">98.5% Rate</text>
  </g>

  <!-- Title Badge Top -->
  <rect x="290" y="16" width="220" height="32" rx="16" fill="rgba(0,180,216,0.2)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="37" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">AVITA DENTAL IMPLANT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Classic Furnace Outer Frame -->
  <rect x="270" y="80" width="260" height="340" rx="16" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <rect x="295" y="110" width="210" height="150" rx="10" fill="#0f172a" stroke="#cbd5e1"/>

  <!-- Muffle Window with Warm Glow -->
  <circle cx="400" cy="185" r="48" fill="#ea580c"/>
  <circle cx="400" cy="185" r="36" fill="#fed7aa"/>

  <!-- Classic Digital LED Display -->
  <rect x="295" y="280" width="210" height="100" rx="8" fill="#020617" stroke="#64748b"/>
  <text x="320" y="320" fill="#22c55e" font-family="'Courier New', monospace" font-size="28" font-weight="bold">940 C</text>
  <text x="320" y="355" fill="#38bdf8" font-family="'Courier New', monospace" font-size="16">VACUUM: 95%</text>

  <!-- Title Badge -->
  <rect x="310" y="24" width="180" height="32" rx="16" fill="rgba(255,255,255,0.1)" stroke="#94a3b8"/>
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">KFP AT100 CLASSIC</text>
</svg>

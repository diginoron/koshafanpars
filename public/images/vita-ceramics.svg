<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b29"/>
      <stop offset="100%" stop-color="#020e18"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- VITA Ceramic Powder Jars -->
  <rect x="220" y="160" width="100" height="150" rx="14" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <rect x="235" y="140" width="70" height="25" rx="5" fill="#dc2626"/>
  <text x="270" y="240" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="16" font-weight="900">VITA</text>
  <text x="270" y="265" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="12" font-weight="bold">VM 9</text>

  <rect x="350" y="140" width="100" height="170" rx="14" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <rect x="365" y="120" width="70" height="25" rx="5" fill="#dc2626"/>
  <text x="400" y="225" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="16" font-weight="900">VITA</text>
  <text x="400" y="250" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="12" font-weight="bold">VM 13</text>

  <!-- 3D Master Tooth Shade Guide Palette -->
  <rect x="480" y="150" width="160" height="200" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">VITA 3D-MASTER</text>
  
  <!-- Shade Teeth tabs -->
  <rect x="500" y="200" width="20" height="40" rx="10" fill="#fef9c3"/>
  <rect x="530" y="200" width="20" height="40" rx="10" fill="#fef08a"/>
  <rect x="560" y="200" width="20" height="40" rx="10" fill="#fde047"/>
  <rect x="590" y="200" width="20" height="40" rx="10" fill="#fed7aa"/>

  <rect x="500" y="255" width="20" height="40" rx="10" fill="#fef9c3"/>
  <rect x="530" y="255" width="20" height="40" rx="10" fill="#fef08a"/>
  <rect x="560" y="255" width="20" height="40" rx="10" fill="#fde047"/>
  <rect x="590" y="255" width="20" height="40" rx="10" fill="#fed7aa"/>

  <!-- Title Badge -->
  <rect x="250" y="30" width="300" height="36" rx="18" fill="rgba(220,38,38,0.2)" stroke="#dc2626"/>
  <text x="400" y="53" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">VITA ZAHNFABRIK GERMANY</text>
</svg>
